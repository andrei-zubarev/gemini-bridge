<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234285F4'/%3E%3Cstop offset='1' stop-color='%23D96570'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23g)' d='M12 1C13.8 7.9 16.1 10.2 23 12c-6.9 1.8-9.2 4.1-11 11-1.8-6.9-4.1-9.2-11-11C7.9 10.2 10.2 7.9 12 1z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <button class="new-chat" id="newChatBtn">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Новый чат
      </button>
      <nav class="chat-list" id="chatList"></nav>
      <div class="sidebar-footer">
        <div class="account-bubble">A</div>
        <span id="accountName">Гость</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="brand">
          <svg class="gemini-star" viewBox="0 0 24 24"><path d="M12 1C13.8 7.9 16.1 10.2 23 12c-6.9 1.8-9.2 4.1-11 11-1.8-6.9-4.1-9.2-11-11C7.9 10.2 10.2 7.9 12 1z"/></svg>
          <span>Gemini</span>
        </div>
        <select id="modelSelect" class="model-select" title="Модель">
          <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
          <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
          <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
          <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro</option>
        </select>
        <div class="topbar-right">
          <button class="icon-btn" id="clearBtn" title="Очистить чат">
            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          </button>
        </div>
      </header>

      <section class="messages" id="messages"></section>

      <footer class="composer-wrap">
        <div class="composer" id="composer">
          <button class="attach-btn" title="Прикрепить файл">
            <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="Спросите Gemini"></textarea>
          <button class="send-btn" id="sendBtn" title="Отправить">
            <svg viewBox="0 0 24 24"><path d="M3.4 20.4l17.45-7.48c.81-.35.81-1.49 0-1.84L3.4 3.6c-.66-.29-1.39.2-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.07-.87.5-.87 1l.01 4.61c0 .71.73 1.2 1.39.91z"/></svg>
          </button>
        </div>
        <p class="composer-hint">Gemini может ошибаться. Проверяйте важную информацию.</p>
        <p class="composer-hint status" id="statusLine"></p>
      </footer>
    </main>
  </div>

  <script src="config.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
